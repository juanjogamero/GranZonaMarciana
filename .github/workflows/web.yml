name: Web · vista interactiva
on:
  push:
    branches: [main, feature/profesionalizar-gran-zona-marciana]
    paths: ["docs/**","scripts/**",".github/workflows/web.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar JavaScript
        run: node --check docs/app.js
      - name: Ejecutar pruebas de la vista
        run: node scripts/check-demo.mjs
