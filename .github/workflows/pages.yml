name: Publicar Gran Zona Marciana en GitHub Pages
on:
  push:
    branches: [main]
    paths: ["docs/**",".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-gran-zona-marciana
  cancel-in-progress: true
jobs:
  comprobar:
    runs-on: ubuntu-latest
    outputs:
      habilitado: ${{ steps.pages.outputs.habilitado }}
    steps:
      - name: Comprobar si GitHub Pages está habilitado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "habilitado=true" >> "$GITHUB_OUTPUT"
          else
            echo "habilitado=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Activa GitHub Pages en Settings > Pages y selecciona GitHub Actions. La web está preparada."
          fi
  deploy:
    needs: comprobar
    if: needs.comprobar.outputs.habilitado == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
