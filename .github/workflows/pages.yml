name: Publicar Gran Zona Marciana en GitHub Pages
on:
  push:
    branches: [main]
    paths: ["docs/**",".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-gran-zona-marciana
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar
        id: publicar
        uses: actions/deploy-pages@v4
