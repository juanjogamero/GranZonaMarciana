name: Android · compilación y pruebas
on:
  push:
    branches: [main, feature/profesionalizar-gran-zona-marciana]
    paths: ["Codigo/**",".github/workflows/android.yml"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Compilar APK y pasar tests
        working-directory: Codigo
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
      - name: Guardar APK de pruebas
        uses: actions/upload-artifact@v4
        with:
          name: GranZonaMarciana-debug
          path: Codigo/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
